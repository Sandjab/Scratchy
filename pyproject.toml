[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scratchy"
version = "2.0.0"
description = "Production-ready AI Image Generation API Server"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # Core
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.26.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    # ML (torch/xformers installed separately with CUDA)
    "diffusers>=0.32.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
    # Tokenizers
    "sentencepiece",
    # Metrics
    "prometheus-client>=0.17.0",
]

[project.optional-dependencies]
# Dev/test dependencies only
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "locust>=2.15.0",
]

[project.scripts]
scratchy-keys = "scratchy.cli.keys:main"
scratchy-backup = "scratchy.cli.backup:main"
scratchy-models = "scratchy.cli.models:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scratchy*"]
