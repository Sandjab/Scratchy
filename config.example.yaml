# Scratchy Configuration Example
# Copy this file to config.yaml and customize as needed
# Environment variables override these settings (prefix: SCRATCHY_)

server:
  host: "0.0.0.0"
  port: 8080
  workers: 1

model:
  # Available models: flux-schnell, flux-dev, z-turbo, sdxl, custom
  name: "flux-schnell"
  # Quantization: none, 8bit, 4bit
  quantization: "none"
  # Device: cuda, mps, cpu
  device: "cuda"

  # === Custom Model Sources (only used when name="custom") ===
  # Priority: local_path > civitai_model_id > download_url

  # Option A: Local model path (file or diffusers directory)
  # local_path: "D:/models/my_model.safetensors"
  # local_path: "./scratchy_data/models/civitai/12345_67890/model.safetensors"

  # Option B: CivitAI model (auto-downloads on first use)
  # civitai_model_id: "12345"
  # civitai_version_id: "67890"  # Optional, uses latest if not set

  # Option C: Direct download URL (auto-downloads on first use)
  # download_url: "https://example.com/model.safetensors"

  # Pipeline type for custom models (auto-detected if not specified)
  # pipeline_type: "sdxl"  # Options: flux, sdxl, sd15, auto

queue:
  max_depth: 10

storage:
  jobs_dir: "./scratchy_data/jobs"
  jobs_ttl_hours: 1
  db_path: "./scratchy_data/scratchy.db"
  backup_dir: "./scratchy_data/backups"
  backup_retention_days: 7
  models_dir: "./scratchy_data/models"  # Where downloaded models are stored

auth:
  # Default rate limit for new API keys (requests per minute)
  default_rate_limit: 10
  # Optional admin API key (leave empty to allow any authenticated key admin access)
  # admin_key: "sk_admin_key_here"

logging:
  level: "INFO"
  format: "json"  # json or text
  include_prompts: false
  retention_days: 7

security:
  # CORS origins - restrict in production
  cors_origins:
    - "*"
  max_prompt_length: 2000
  max_negative_prompt_length: 500
